name: Publish to Phoenix Nexus

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: gactions
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: nexus-repo
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Deploy to Phoenix Nexus
        run: mvn -B deploy -DskipTests -Dgpg.skip=true --file pom.xml
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
