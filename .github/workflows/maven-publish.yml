# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Release Phoenix XSeries

on:
  push:
    tags:
      - 'v*-phoenix.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-phoenix\.[0-9]+$ ]]; then
            echo "Invalid Phoenix release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: phoenix-repo
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build and publish with Maven
        run: mvn -B -ntp -Drevision="${RELEASE_VERSION}" -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.PHOENIX_MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.PHOENIX_MAVEN_PASSWORD }}
